# =============================================================================
# Marketplace Staging — Docker Compose
# =============================================================================
# Services:
#   store  — Next.js storefront  (internal :3000, behind Caddy)
#   admin  — Next.js admin        (internal :3001, behind Caddy)
#   caddy  — reverse proxy + auto-HTTPS (Let's Encrypt PRODUCTION)
#   migrate/bootstrap — one-shot (profile: tools), tanpa seed demo
#
# Postgres berjalan BARE-METAL di VPS (di luar compose), diakses via
# host.docker.internal yang di-map ke host gateway lewat extra_hosts.
#
# Dockerfile bersama (store/admin/migrate) ada di deployment/common/.
# Config env-spesifik (file ini + caddy/Caddyfile + .env) ada di sini.
#
# Usage (dari folder ini):
#   cp .env.example .env                    # lalu isi secret
#   docker compose -p staging --env-file .env up -d --build
#   docker compose -p staging --env-file .env --profile tools run --rm migrate
#
# Rebuild after domain/NEXT_PUBLIC change:
#   docker compose -p staging --env-file .env up -d --build
#
# NOTE: container_name sengaja TIDAK di-set — nama container di-generate dari
# project name (-p staging) jadi `staging-store-1`, `staging-admin-1`, dst.
# Ini memungkinkan staging & production jalan berdampingan di satu VPS tanpa
# bentrok nama container. Lihat docs/deployment-docs/environments.md.
# =============================================================================

# Variable interpolation from .env (passed via --env-file).
# PostgreSQL bare-metal connection string — DISAMAKAN LANGSUNG dari DATABASE_URL
# di .env. Jangan di-construct ulang dari PGUSER/PGPASS/PGDB karena:
#   1. .env hanya wajib set DATABASE_URL (PGUSER/PGPASS/PGDB opsional,
#      hanya untuk reference/dokumentasi).
#   2. Mencegah mismatch kalau user edit DATABASE_URL tapi lupa update PGUSER.
#   3. Password dengan karakter special (mis. @, :, /) butuh URL-encoding di
#      DATABASE_URL — construct ulang dari komponen akan pecah encoding.
x-pg: &pg-conn
  DATABASE_URL: "${DATABASE_URL}"

# Persist container stdout/stderr in the VPS systemd journal. Retention follows
# the existing host journald policy; Compose does not modify host configuration.
x-logging: &journald-logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  # ---------------------------------------------------------------------------
  # STOREFRONT
  # ---------------------------------------------------------------------------
  store:
    build:
      context: ../..
      dockerfile: deployment/common/store/Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined at build time — must be present during build.
        NEXT_PUBLIC_APP_URL: "https://dev-store.adfsport.cloud"
        NEXT_PUBLIC_APP_NAME: "${NEXT_PUBLIC_APP_NAME:-Marketplace Staging}"
        NEXT_PUBLIC_STORE_URL: "https://dev-store.adfsport.cloud"
    restart: unless-stopped
    logging: *journald-logging
    environment:
      <<: *pg-conn
      NODE_ENV: production
      # Tenant sandbox lokal; NODE_ENV tidak menentukan tenant provider.
      APP_ENV: staging
      APP_RELEASE: ${APP_RELEASE:?APP_RELEASE wajib diisi}
      JUBELIO_SALES_TEST_ACCOUNT_ENABLED: "true"
      # Store hanya diakses lewat Caddy (port tidak dipublish). Caddy menimpa
      # X-Real-IP/X-Forwarded-For dengan remote_host, jadi admission checkout
      # boleh memakai IP itu; tanpa flag ini preview/place-order gagal tertutup
      # 503 POLICY_UNAVAILABLE. Lihat docs/deployment-docs/discounts-cutover.md.
      CHECKOUT_TRUST_PROXY: "true"
      # Better Auth (store)
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: "https://dev-store.adfsport.cloud"
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # SMTP (email verification, order emails)
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      # Midtrans payment (sandbox for staging)
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY}
      MIDTRANS_IS_PRODUCTION: "false"
      MIDTRANS_PAYMENT_MODE: ${MIDTRANS_PAYMENT_MODE:-snap}
      # Cron secret for the stock-reservation sweep endpoint
      # (POST /api/cron/sweep-reservations, header X-Cron-Secret).
      CRON_SECRET: ${CRON_SECRET}
      JUBELIO_API_BASE_URL: ${JUBELIO_API_BASE_URL:-https://api2.jubelio.com}
      JUBELIO_EMAIL: ${JUBELIO_EMAIL}
      JUBELIO_PASSWORD: ${JUBELIO_PASSWORD}
      JUBELIO_CHANNEL_ID: ${JUBELIO_CHANNEL_ID:-64}
      JUBELIO_SHIPMENT_URL: ${JUBELIO_SHIPMENT_URL:-https://api-shipment.jubelio.com}
      JUBELIO_SHIPMENT_CLIENT_ID: ${JUBELIO_SHIPMENT_CLIENT_ID:-}
      JUBELIO_SHIPMENT_CLIENT_SECRET: ${JUBELIO_SHIPMENT_CLIENT_SECRET:-}
      JUBELIO_SHIPMENT_WEBHOOK_SECRET: ${JUBELIO_SHIPMENT_WEBHOOK_SECRET:-}
      JUBELIO_WEBHOOK_SECRET: ${JUBELIO_WEBHOOK_SECRET}
      JUBELIO_SYNC_CONCURRENCY: ${JUBELIO_SYNC_CONCURRENCY:-5}
      JUBELIO_SYNC_MAX_PRODUCTS: ""
      JUBELIO_SYNC_START_PAGE: ""
      JUBELIO_PAYMENT_ACCOUNT_ID: ${JUBELIO_PAYMENT_ACCOUNT_ID:-}
      JUBELIO_PAYMENT_TYPE: ${JUBELIO_PAYMENT_TYPE:-}
      JUBELIO_ITEM_UNIT: ${JUBELIO_ITEM_UNIT:-Buah}
      JUBELIO_ITEM_TAX_ID: ${JUBELIO_ITEM_TAX_ID:-}
      # Direct adjustment production tidak boleh menjadi fallback staging.
      JUBELIO_STOCK_WRITES_ENABLED: "false"
      JUBELIO_ADJUSTMENT_PLUS_ACCOUNT_ID: ${JUBELIO_ADJUSTMENT_PLUS_ACCOUNT_ID:-}
      JUBELIO_ADJUSTMENT_MINUS_ACCOUNT_ID: ${JUBELIO_ADJUSTMENT_MINUS_ACCOUNT_ID:-}
      JUBELIO_STOCK_TIMEOUT_MS: ${JUBELIO_STOCK_TIMEOUT_MS:-8000}
      JUBELIO_STOCK_MAX_REQUESTS_PER_MINUTE: ${JUBELIO_STOCK_MAX_REQUESTS_PER_MINUTE:-450}
      JUBELIO_STOCK_CONCURRENCY: ${JUBELIO_STOCK_CONCURRENCY:-10}
      JUBELIO_STOCK_MAX_QUEUED: ${JUBELIO_STOCK_MAX_QUEUED:-1000}
      JUBELIO_STOCK_QUEUE_TIMEOUT_MS: ${JUBELIO_STOCK_QUEUE_TIMEOUT_MS:-5000}
      # Uploads — shared named volume mounted at /app/uploads
      UPLOADS_DIR: /app/uploads
      # Internal URL the admin app uses to call this store's internal endpoints.
      # Set here for self-reference; admin gets its own STORE_INTERNAL_URL.
      STORE_INTERNAL_URL: "http://store:3000"
    volumes:
      - uploads:/app/uploads
    extra_hosts:
      # On Linux, map host.docker.internal to the host's gateway IP so the
      # container can reach the bare-metal Postgres on the VPS.
      - "host.docker.internal:host-gateway"
    # Ports are NOT published to the host — Caddy handles public ingress.
    expose:
      - "3000"
    healthcheck:
      # 127.0.0.1 (bukan `localhost`): `localhost` di container resolve ke
      # IPv6 ::1 di mana server tidak listen → healthcheck false-unhealthy.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # ADMIN DASHBOARD
  # ---------------------------------------------------------------------------
  admin:
    build:
      context: ../..
      dockerfile: deployment/common/admin/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: "https://dev-admin.adfsport.cloud"
        NEXT_PUBLIC_APP_NAME: "${NEXT_PUBLIC_APP_NAME:-Marketplace Admin Staging}"
        NEXT_PUBLIC_STORE_URL: "https://dev-store.adfsport.cloud"
        NEXT_PUBLIC_ADMIN_URL: "https://dev-admin.adfsport.cloud"
    restart: unless-stopped
    logging: *journald-logging
    environment:
      <<: *pg-conn
      NODE_ENV: production
      APP_ENV: staging
      APP_RELEASE: ${APP_RELEASE:?APP_RELEASE wajib diisi}
      # Better Auth (admin) — secret MUST be identical to store's so the
      # shared-HMAC verify-pickup handshake works between admin and store.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # Base URL for the admin app. Required so Better Auth constructs
      # correct redirect/callback URLs and applies the __Secure- cookie
      # prefix in production. Must match the public URL Caddy serves.
      BETTER_AUTH_URL: "https://dev-admin.adfsport.cloud"
      # SMTP (admin sends password-reset emails)
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      JUBELIO_API_BASE_URL: ${JUBELIO_API_BASE_URL:-https://api2.jubelio.com}
      JUBELIO_EMAIL: ${JUBELIO_EMAIL}
      JUBELIO_PASSWORD: ${JUBELIO_PASSWORD}
      JUBELIO_CHANNEL_ID: ${JUBELIO_CHANNEL_ID:-64}
      JUBELIO_SYNC_CONCURRENCY: ${JUBELIO_SYNC_CONCURRENCY:-5}
      JUBELIO_SYNC_MAX_PRODUCTS: ""
      JUBELIO_SYNC_START_PAGE: ""
      # Shipment packing/booking uses separate credentials, never Omnichannel.
      JUBELIO_SHIPMENT_URL: ${JUBELIO_SHIPMENT_URL:-https://api-shipment.jubelio.com}
      JUBELIO_SHIPMENT_CLIENT_ID: ${JUBELIO_SHIPMENT_CLIENT_ID:-}
      JUBELIO_SHIPMENT_CLIENT_SECRET: ${JUBELIO_SHIPMENT_CLIENT_SECRET:-}
      JUBELIO_SHIPMENT_TIMEOUT_MS: ${JUBELIO_SHIPMENT_TIMEOUT_MS:-10000}
      # Uploads — shared named volume (admin writes, store reads)
      UPLOADS_DIR: /app/uploads
      # URL the admin app uses to call the store's internal endpoints
      # (/api/internal/order-complete). Uses the compose service DNS name.
      STORE_INTERNAL_URL: "http://store:3000"
    volumes:
      - uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3001"
    depends_on:
      store:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # CADDY — reverse proxy + auto-HTTPS (Let's Encrypt PRODUCTION)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *journald-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # sertifikat Let's Encrypt — PERSIST, jangan dihapus
      - caddy_config:/config
    depends_on:
      - store
      - admin

  # ---------------------------------------------------------------------------
  # MIGRATE — one-shot (profile: tools). Tidak auto-start dengan `up`.
  # Jalankan manual: docker compose --profile tools run --rm migrate
  # ---------------------------------------------------------------------------
  migrate:
    profiles: ["tools"]
    logging: *journald-logging
    build:
      context: ../..
      dockerfile: deployment/common/migrate/Dockerfile
    environment:
      <<: *pg-conn
      NODE_ENV: production
      APP_ENV: staging
      APP_RELEASE: ${APP_RELEASE:?APP_RELEASE wajib diisi}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Default hanya migration resmi. Jangan gunakan seed.ts/reset.ts saat cutover.

  bootstrap:
    profiles: ["tools"]
    logging: *journald-logging
    build:
      context: ../..
      dockerfile: deployment/common/migrate/Dockerfile
    entrypoint: ["npx", "tsx", "src/production-bootstrap.ts"]
    command: ["preflight", "--config", "/bootstrap/bootstrap.config.json", "--phase", "before-migrate"]
    environment:
      <<: *pg-conn
      NODE_ENV: production
      APP_ENV: staging
      APP_RELEASE: ${APP_RELEASE:?APP_RELEASE wajib diisi}
      # Tools hanya memperoleh credentials master-read sandbox.
      JUBELIO_API_BASE_URL: ${JUBELIO_API_BASE_URL:-https://api2.jubelio.com}
      JUBELIO_EMAIL: ${JUBELIO_EMAIL}
      JUBELIO_PASSWORD: ${JUBELIO_PASSWORD}
      JUBELIO_SYNC_CONCURRENCY: ${JUBELIO_SYNC_CONCURRENCY:-2}
      JUBELIO_SYNC_MAX_RETRIES: ${JUBELIO_SYNC_MAX_RETRIES:-5}
      JUBELIO_SYNC_TIMEOUT_MS: ${JUBELIO_SYNC_TIMEOUT_MS:-30000}
      JUBELIO_SYNC_REQUESTS_PER_MINUTE: ${JUBELIO_SYNC_REQUESTS_PER_MINUTE:-120}
      JUBELIO_SYNC_MAX_PRODUCTS: ""
      JUBELIO_SYNC_START_PAGE: ""
    volumes:
      - type: bind
        source: ./bootstrap.config.json
        target: /bootstrap/bootstrap.config.json
        read_only: true
        bind:
          create_host_path: false
      - ${BOOTSTRAP_REPORT_DIR:-/home/ops/log/marketplace-bootstrap/staging}:/reports
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  uploads:        # shared by store + admin for /app/uploads
  caddy_data:     # Caddy cert store — persists across restarts
  caddy_config:   # Caddy runtime config
